[project]
name = "stacked-lejepa"
version = "0.1.0"
description = "Pooled distributional regularization for JEPAs"
requires-python = ">=3.10"

dependencies = [
    "scipy",
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "matplotlib",
    "timm>=1.0",
    "stable-pretraining",
    "stable-worldmodel",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipywidgets",
]
